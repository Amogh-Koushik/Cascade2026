[project]
name = "pratibimb"
version = "0.1.0"
description = "Laptop-side tools for Pratibimb: LLM agents, reference engine, simulator and edge server."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# This repo is a set of tools and services, not a library to publish.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
